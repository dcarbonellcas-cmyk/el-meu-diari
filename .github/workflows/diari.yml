name: Actualitzar i publicar el diari
on:
  push:
    branches: [main]
    paths-ignore:
      - 'diaris/**'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instal·lar el generador PDF
        run: python -m pip install reportlab==4.4.3
      - name: Crear i arxivar el diari d’avui
        run: python scripts/generate_diary.py --output diaris
      - name: Guardar les edicions al repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diaris
          if ! git diff --cached --quiet; then
            git commit -m "Arxivar nova edició del diari [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preparar el lloc amb tot l’arxiu
        run: |
          mkdir -p _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R assets _site/assets
          cp -R diaris _site/diaris
          touch _site/.nojekyll
      - name: Configurar la publicació automàtica
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/configure_pages.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
